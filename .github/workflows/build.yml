name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -timeout 60s ./...
      - run: go vet ./...
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l main.go internal)"

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make release VERSION="${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: ugen300-tui-binaries
          path: dist/ugen300-tui-*
